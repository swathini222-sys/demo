<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Workshops</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("../backgrimg.jpg") center/cover fixed no-repeat;
}

/* ---------- Navigation ---------- */

.navbar{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    padding:30px;
}

.navbar a{
    text-decoration:none;
    color:#000;
    padding:12px 22px;
    border:2px solid rgb(187,76,168);
    border-radius:30px;
    background:white;
    transition:.4s;
}

.navbar a:hover{
    background:rgb(255,225,100);
    color:red;
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

/* ---------- Main Container ---------- */

.container{

    width:90%;
    max-width:1200px;
    margin:40px auto;
    background:#fff5fb;
    border-radius:15px;
    padding:30px;
    animation:fadeIn 1s ease;
}

.container h1{
    text-align:center;
    margin-bottom:30px;
    color:#b84aa8;
}

/* ---------- Workshop Cards ---------- */

.card{

    display:flex;
    align-items:center;
    gap:30px;

    margin-bottom:30px;
    padding:25px;

    background:#d7eef0;

    border-radius:15px;

    transition:.4s;
}

.card:hover{

    transform:translateY(-10px);

    background:#ffe9fa;

    box-shadow:0 15px 30px rgba(0,0,0,.2);

}

.card img{

    width:250px;

    border-radius:15px;

    transition:.5s;

}

.card:hover img{

    transform:scale(1.08) rotate(2deg);

}

.details{

    flex:1;

}

.details h2{

    color:#b84aa8;

    margin-bottom:15px;

}

.details p{

    font-size:18px;

    margin:10px 0;

}

/* ---------- Button ---------- */

button{

    margin-top:20px;

    padding:14px 28px;

    border:none;

    border-radius:30px;

    background:#b84aa8;

    color:white;

    font-size:17px;

    cursor:pointer;

    transition:.4s;

}

button:hover{

    background:#ff5ca8;

    transform:scale(1.08);

    box-shadow:0 10px 20px rgba(0,0,0,.3);

}

/* ---------- Animation ---------- */

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/* ---------- Mobile ---------- */

@media(max-width:768px){

.card{

flex-direction:column;

text-align:center;

}

.card img{

width:100%;

max-width:320px;

}

.navbar{

gap:10px;

padding:20px;

}

.navbar a{

font-size:14px;

padding:10px 16px;

}

.container{

padding:20px;

}

}

@media(max-width:480px){

.container{

width:95%;

padding:15px;

}

.container h1{

font-size:28px;

}

.details h2{

font-size:22px;

}

.details p{

font-size:16px;

}

button{

width:100%;

}

}

</style>
</head>

<body>

<nav class="navbar">

<a href="project.html">HOME</a>

<a href="about.html">ABOUT</a>

<a href="menu.html">MENU</a>

<a href="order.html">ORDER ONLINE</a>

<a href="contact.html">CONTACT</a>

<a href="workshop.html">WORKSHOPS</a>

</nav>

<div class="container">

<h1>BOOK A WORKSHOP</h1>

<div class="card">

<img src="work1.jpg" alt="Cupcake Workshop">

<div class="details">

<h2>Cupcake Master</h2>

<p>⏰ Duration : 3 Hours</p>

<p>💲 Price : $115</p>

<button>Book the Workshop</button>

</div>

</div>

<div class="card">

<img src="work2.jpg" alt="Baking Workshop">

<div class="details">

<h2>Baking Workshop</h2>

<p>⏰ Duration : 1 Hour 30 Minutes</p>

<p>💲 Price : $65</p>

<button>Book the Workshop</button>

</div>

</div>

<div class="card">

<img src="work3.jpg" alt="Frosting Workshop">

<div class="details">

<h2>Frosting Workshop</h2>

<p>⏰ Duration : 2 Hours</p>

<p>💲 Price : $85</p>

<button>Book the Workshop</button>

</div>

</div>

</div>

</body>
</html>
