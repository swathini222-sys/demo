<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:url("../backgrimg.jpg") center/cover fixed;
}

/* Header */

header{
    text-align:center;
    padding:20px;
    background:#fff;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.logo{
    width:120px;
    border-radius:50%;
}
header h1{
    color:#d63384;
    margin-top:10px;
    font-size:40px;
}

/* Navbar */

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    background:#ff4d6d;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:600;
    transition:.4s;
    position:relative;
}

nav a::after{
    content:'';
    position:absolute;
    left:0;
    bottom:-5px;
    width:0;
    height:3px;
    background:#fff;
    transition:.4s;
}

nav a:hover::after{
    width:100%;
}

nav a:hover{
    transform:translateY(-4px);
}

/* Banner */

.banner{
    display:flex;
    justify-content:center;
    padding:40px;
    border-radius:80px;
}

.banner img{
    width:90%;
    max-width:900px;
    border-radius:20px;
    transition:.5s;
    animation:zoom 3s infinite alternate;
}

.banner img:hover{
    transform:scale(1.05);
    box-shadow:0 20px 40px rgba(168, 46, 147, 0.3);
}

@keyframes zoom{

from{
transform:scale(.95);
}

to{
transform:scale(1);
}

}

/* Gallery */

.gallery-title{
    text-align:center;
    margin:40px 0;
    color:#d63384;
    font-size:35px;
}

.gallery{
    display:flex;
    overflow:auto;
    gap:20px;
    padding:20px;
}

.gallery img{
    width:220px;
    height:220px;
    object-fit:cover;
    border-radius:20px;
    transition:.5s;
    cursor:pointer;
}

.gallery img:hover{
    transform:scale(1.1) rotate(5deg);
    box-shadow:0 15px 30px rgba(0,0,0,.3);
}

/* Cards */

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
    padding:60px 20px;
}

.card{
    width:220px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    transition:.5s;
}

.card:hover{
    transform:translateY(-15px);
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.card img{
    width:80px;
    margin-bottom:15px;
}

.card a{
    display:inline-block;
    margin-top:15px;
    padding:10px 25px;
    background:#ff4d6d;
    color:#fff;
    text-decoration:none;
    border-radius:30px;
    transition:.4s;
}

.card a:hover{
    background:#d63384;
    transform:scale(1.1);
}

/* Responsive */

@media(max-width:768px){

header h1{
font-size:28px;
}

nav{
gap:10px;
}

nav a{
font-size:15px;
}

.gallery img{
width:160px;
height:160px;
}

.card{
width:90%;
}

}
.slider{

overflow:hidden;
margin:30px auto;
width:95%;

}

.slide-track{

display:flex;
width:calc(300px * 8);
animation:scroll 20s linear infinite;

}

.slide-track img{

width:300px;
height:220px;
object-fit:cover;
margin:10px;
border-radius:15px;
transition:.5s;

}

.slide-track img:hover{

transform:scale(1.1);

}

@keyframes scroll{

0%{
transform:translateX(0);
}

100%{
transform:translateX(-1200px);
}

}


</style>

</head>
<body>

<header>

<img src="cake 1.jpg" class="logo">

<h1>Love At First Bites.</h1>

</header>

<nav>

<a href="index.html">HOME</a>

<a href="about.html">ABOUT</a>

<a href="menu.html">MENU</a>

<div class="gallery">

<img src="cupcake4.jpg">

<img src="cupcake.jpg">

<img src="cupcake3.jpg">

<img src="cupcake4.jpg">
<img src="cupcake3.jpg">
<img src="cupcake.jpg">



</div>

<section class="cards">

<h3>Our Cakes</h3>

<p>Freshly baked with love.</p>

</div>

<img src="menu.png">

<h3>Menu</h3>

<p>Choose your favorite cake.</p>

</div>

</div>

</section>

</body>
</html>
