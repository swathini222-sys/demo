<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:url("../backgrimg.jpg") no-repeat center;
    background-size:cover;
    background-attachment:fixed;
}

/* Navigation */

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    padding:30px 20px;
}

nav a{
    text-decoration:none;
    color:black;
    border:2px solid rgb(187,76,168);
    padding:12px 22px;
    border-radius:30px;
    font-weight:bold;
    transition:.4s;
}

nav a:hover{
    background:rgb(187,76,168);
    color:white;
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

/* Main Section */

.container{

    width:90%;
    max-width:1200px;
    margin:40px auto;

    display:flex;
    gap:30px;
    align-items:center;

    background:rgba(255,255,255,.85);
    padding:30px;
    border-radius:20px;

    animation:fadeUp 1s ease;
}

/* Image */

.image-box{
    flex:1;
}

.image-box img{

    width:100%;
    border-radius:15px;
    transition:.5s;
}

.image-box img:hover{

    transform:scale(1.05);
    box-shadow:0px 15px 30px rgba(0,0,0,.4);

}

/* Contact */

.contact{

    flex:1;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    transition:.4s;
}

.contact:hover{

    transform:translateY(-10px);

}

.contact h1{

    text-align:center;
    margin-bottom:15px;
    color:#c13ca8;

}

address{

    text-align:center;
    margin-bottom:20px;
    line-height:28px;
    font-style:normal;

}

/* Form */

fieldset{

    border:2px solid #c13ca8;
    padding:20px;
    border-radius:10px;

}

legend{

    padding:5px 10px;
    font-weight:bold;

}

input{

    width:100%;
    padding:12px;
    margin:8px 0 15px;
    border-radius:8px;
    border:1px solid gray;
    outline:none;
    transition:.3s;

}

input:focus{

    border-color:#c13ca8;
    box-shadow:0 0 8px pink;

}

.name{

    display:flex;
    gap:10px;

}

button{

    width:100%;
    padding:14px;
    background:#c13ca8;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    transition:.4s;

}

button:hover{

    background:#ff4cb2;
    transform:scale(1.05);

}

/* Map */

.map{

    width:90%;
    max-width:1200px;
    margin:40px auto;

}

.map iframe{

    width:100%;
    height:450px;
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);

}

/* Animation */

@keyframes fadeUp{

    from{

        opacity:0;
        transform:translateY(50px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

/* Mobile */

@media(max-width:768px){

.container{

    flex-direction:column;
    padding:20px;

}

nav{

    gap:10px;

}

nav a{

    padding:10px 15px;
    font-size:14px;

}

.name{

    flex-direction:column;

}

.map iframe{

    height:300px;

}

}

/* Small Mobile */

@media(max-width:480px){

nav{

    flex-direction:column;
    align-items:center;

}

nav a{

    width:220px;
    text-align:center;

}

.container{

    width:95%;

}

.contact{

    padding:15px;

}

}

</style>
</head>

<body>

<nav>

<a href="project.html">HOME</a>
<a href="about.html">ABOUT</a>
<a href="menu.html">MENU</a>
<a href="order.html">ORDER ONLINE</a>
<a href="contact.html">CONTACT</a>
<a href="workshop.html">WORKSHOP</a>

</nav>

<div class="container">

<div class="image-box">
<img src="cake4.jpg" alt="Cake">
</div>

<div class="contact">

<h1>Contact Us</h1>

<address>

500 Terry Francine Street<br>
San Francisco, CA 94158<br>
info@mysite.com<br>
123-456-7890

</address>

<form>

<fieldset>

<legend>Delivery Address</legend>

<div class="name">

<input type="text" placeholder="First Name" required>

<input type="text" placeholder="Last Name" required>

</div>

<input type="text" placeholder="Street Address" required>

<input type="text" placeholder="Apartment / Floor">

<input type="text" placeholder="City" required>

<input type="email" placeholder="Email" required>

<input type="tel" placeholder="Phone Number" required>

<button>SUBMIT</button>

</fieldset>

</form>

</div>

</div>

</body>
</html>
